<!DOCTYPE html>
<html>
    <title>AR.js A-Frame Location-based</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js'></script>
<script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'></script>
    <body style="margin : 0px; overflow: hidden;">
        <!--<a-scene embedded arjs>-->
        <!--<a-marker preset="hiro">-->
            <a-scene vr-mode-ui='enabled: false' arjs='sourceType: webcam; videoTexture: true; debugUIEnabled: false' renderer='antialias: true; alpha: true'>
            <a-camera gps-new-camera='gpsMinDistance: 250'></a-camera>
         <!--<a-entity gltf-model="WendigoAR.gltf" gps-new-entity-place="latitude: <47.557921>; longitude: <9.697341>" scale="0.2 0.2 0.2"></a-entity>-->
         <a-entity material='color: red' geometry='primitive: box' gps-new-entity-place="latitude 47.557921; longitude: 9.697341" scale="0.2 0.2 0.2"></a-entity>
            <!-- we use cors proxy to avoid cross-origin problems ATTENTION! you need to set up your server -->
            <!--<a-entity
            position="0 0 0"
            scale="0.02 0.02 0.02"
            gltf-model="WendigoAR.gltf"
            ></a-entity> -->
        <!--</a-marker>-->
        <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
