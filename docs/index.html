<!DOCTYPE html>
<html>
    <title>AR.js A-Frame Location-based</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js'></script>
<script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'></script>

    <body style="margin : 0px; overflow: hidden;">
            <a-scene vr-mode-ui='enabled: false' arjs='sourceType: webcam; videoTexture: true; debugUIEnabled: false' renderer='antialias: true; alpha: true'>
            <a-camera gps-new-camera='gpsMinDistance: 1 positionMinAccuracy: 100 alert: true gpsTimeInterval: 5' ></a-camera>
         <a-entity gltf-model="WendigoAR.gltf" gps-new-entity-place="latitude: 47.557944; longitude: 9.6973631" depth="10" height="10" width="10" scale="0.02 0.02 0.02"  position="0 30 0"></a-entity>
        
        <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
