<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>AR Dino Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">

</head>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<!-- we import arjs version without NFT but with marker + location based support -->
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<body style="margin : 0px; overflow: hidden;">
    <a-scene embedded arjs>
        <a-marker preset="hiro">
            <!-- we use cors proxy to avoid cross-origin problems ATTENTION! you need to set up your server -->
            <a-entity position="0 0 0" scale="0.05 0.05 0.05" gltf-model="trex/scene.gltf"></a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <div id="sw-update"
        style="display:none;position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#202020;color:#fff;padding:.6rem 1rem;border-radius:6px;font:14px sans-serif;z-index:10;">
        Update verfügbar <button id="sw-reload" style="margin-left:.5rem;">Neu laden</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./serviceworker.js').then(reg => {
                function showUpdate(worker) {
                    const bar = document.getElementById('sw-update');
                    bar.style.display = 'block';
                    document.getElementById('sw-reload').onclick = () => {
                        worker.postMessage({ type: 'SKIP_WAITING' });
                    };
                }

                function listen(registration) {
                    if (!registration) return;
                    if (registration.waiting) {
                        showUpdate(registration.waiting);
                    }
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && registration.waiting) {
                                showUpdate(registration.waiting);
                            }
                        });
                    });
                }

                listen(reg);
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    window.location.reload();
                });
            }).catch(console.error);
        }
    </script>

</body>

</html>
