<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <title>AR Entdecker App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            touch-action: pan-y;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        /* Landing Page */
        #landing {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            text-align: center;
        }

        #landing h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #0f3460;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #landing p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #e94560;
            max-width: 80%;
        }

        .cta-button {
            background: linear-gradient(135deg, #e94560 0%, #d63447 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cta-button:hover, .cta-button:active {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.6);
        }

        .install-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9rem;
            display: none;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .install-button:hover, .install-button:active {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Screen A - Navigation */
        #screen-a {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            justify-content: flex-start;
            padding-top: 40px;
        }

        .instruction-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 500px;
        }

        .instruction-box h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .instruction-box p {
            font-size: 1rem;
            line-height: 1.6;
        }

        .map-container {
            width: 90%;
            max-width: 500px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .map-placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
        }

        .action-button {
            margin-top: 30px;
            background: linear-gradient(135deg, #e94560 0%, #d63447 100%);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .action-button:hover, .action-button:active {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.6);
        }

        /* Screen B - Modal */
        #screen-b {
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
        }

        .modal-content {
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            font-size: 2rem;
            color: #e94560;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .success-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        /* Screen C - AR View */
        #screen-c {
            padding: 0;
            background: #000;
        }

        #ar-scene {
            width: 100%;
            height: 100%;
        }

        .ar-button {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560 0%, #d63447 100%);
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.6);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .ar-button:hover, .ar-button:active {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.8);
        }

        /* Update Banner */
        #sw-update {
            display: none;
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: #202020;
            color: #fff;
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font: 14px sans-serif;
            z-index: 10000;
        }

        #sw-reload {
            margin-left: 0.5rem;
            background: #e94560;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <!-- Landing Page -->
    <div id="landing" class="screen active">
        <h1>AR Entdecker</h1>
        <p>Begib dich auf eine spannende Entdeckungsreise durch Lindau!</p>
        <button class="cta-button" onclick="startApp()">Abenteuer starten</button>
    </div>

    <!-- Screen A: Navigation Instructions -->
    <div id="screen-a" class="screen">
        <div class="instruction-box">
            <h2>📍 Nächstes Ziel</h2>
            <p id="location-instruction">Begib dich zum Haupteingang des Gebäudes. Dort erwartet dich eine besondere Überraschung!</p>
        </div>
        <div class="map-container">
            <img id="map-image" src="" alt="Karte" style="display:none;">
            <div class="map-placeholder" id="map-placeholder">🗺️ Karte wird geladen...</div>
        </div>
        <button class="action-button" onclick="arrivedAtLocation()">Ich bin angekommen</button>
    </div>

    <!-- Screen B: Arrival Confirmation -->
    <div id="screen-b" class="screen">
        <div class="modal-content">
            <div class="success-icon">✅</div>
            <h2>Perfekt!</h2>
            <p>Du bist am Ziel angekommen. Bereit für die AR-Erfahrung?</p>
            <button class="action-button" onclick="startAR()">Weiter zur AR-Ansicht</button>
        </div>
    </div>

    <!-- Screen C: AR View -->
    <div id="screen-c" class="screen">
        <a-scene id="ar-scene" embedded arjs vr-mode-ui="enabled: false">
            <a-marker preset="hiro">
                <!-- AR Platzhalter - 3D-Objekt -->
                <a-box position="0 0.5 0" material="color: #e94560;" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"></a-box>
                <a-sphere position="0 1.5 0" radius="0.3" material="color: #0f3460;" animation="property: position; to: 0 2 0; dir: alternate; loop: true; dur: 2000"></a-sphere>
            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>
        <button class="ar-button" onclick="nextLocation()">➜</button>
    </div>

    <!-- Install Button -->
    <button id="install-btn" class="install-button">📱 Auf Homescreen legen</button>

    <!-- Update Banner -->
    <div id="sw-update">
        Update verfügbar <button id="sw-reload">Neu laden</button>
    </div>

    <script>
        // PWA Installation
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').style.display = 'block';
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
                document.getElementById('install-btn').style.display = 'none';
            }
        });

        // Navigation zwischen Screens
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function startApp() {
            showScreen('screen-a');
        }

        function arrivedAtLocation() {
            showScreen('screen-b');
        }

        function startAR() {
            showScreen('screen-c');
        }

        function nextLocation() {
            // Hier könnten verschiedene Locations rotiert werden
            showScreen('screen-a');
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./serviceworker.js').then(reg => {
                function showUpdate(worker) {
                    const bar = document.getElementById('sw-update');
                    bar.style.display = 'block';
                    document.getElementById('sw-reload').onclick = () => {
                        worker.postMessage({ type: 'SKIP_WAITING' });
                    };
                }

                function listen(registration) {
                    if (!registration) return;
                    if (registration.waiting) {
                        showUpdate(registration.waiting);
                    }
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && registration.waiting) {
                                showUpdate(registration.waiting);
                            }
                        });
                    });
                }

                listen(reg);
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    window.location.reload();
                });
            }).catch(console.error);
        }
    </script>

</body>

</html>
