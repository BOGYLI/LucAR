<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <title>AR Entdecker App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js'></script>
    <script type='text/javascript' src='https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js'></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Landing Page -->
    <div id="landing" class="screen active">
        <h1>AR Entdecker</h1>
        <p>Begib dich auf eine spannende Entdeckungsreise durch Lindau!</p>
        <button class="cta-button" onclick="startApp()">Abenteuer starten</button>
    </div>

    <!-- Screen A: Navigation Instructions -->
    <div id="screen-a" class="screen">
        <div class="instruction-box">
            <h2>📍 Nächstes Ziel</h2>
            <p id="location-instruction">Begib dich zum Haupteingang des Gebäudes. Dort erwartet dich eine besondere Überraschung!</p>
        </div>
        <div class="map-container">
            <img id="map-image" src="" alt="Karte" style="display:none;">
            <div class="map-placeholder" id="map-placeholder">🗺️ Karte wird geladen...</div>
        </div>
        <button class="action-button" onclick="arrivedAtLocation()">Ich bin angekommen</button>
    </div>

    <!-- Screen B: Arrival Confirmation -->
    <div id="screen-b" class="screen">
        <div class="modal-content">
            <div class="success-icon">✅</div>
            <h2>Perfekt!</h2>
            <p>Du bist am Ziel angekommen. Bereit für die AR-Erfahrung?</p>
            <button class="action-button" onclick="startAR()">Weiter zur AR-Ansicht</button>
        </div>
    </div>

    <!-- Screen C: AR View -->
    <div id="screen-c" class="screen">
        <a-scene id="ar-scene" embedded arjs vr-mode-ui="enabled: false">
            <a-marker preset="hiro">
                <!-- AR Platzhalter - 3D-Objekt -->
                <a-box position="0 0.5 0" material="color: #e94560;" animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"></a-box>
                <a-sphere position="0 1.5 0" radius="0.3" material="color: #0f3460;" animation="property: position; to: 0 2 0; dir: alternate; loop: true; dur: 2000"></a-sphere>
            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>
        <button class="ar-button" onclick="nextLocation()">➜</button>
    </div>

    <!-- Install Button -->
    <button id="install-btn" class="install-button">📱 Auf Homescreen legen</button>

    <!-- Update Banner -->
    <div id="sw-update">
        Update verfügbar <button id="sw-reload">Neu laden</button>
    </div>

    <script>
        // PWA Installation
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-btn').style.display = 'block';
        });

        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
                document.getElementById('install-btn').style.display = 'none';
            }
        });

        // Navigation zwischen Screens
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function startApp() {
            showScreen('screen-a');
        }

        function arrivedAtLocation() {
            showScreen('screen-b');
        }

        function startAR() {
            showScreen('screen-c');
        }

        function nextLocation() {
            // Hier könnten verschiedene Locations rotiert werden
            showScreen('screen-a');
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./serviceworker.js').then(reg => {
                function showUpdate(worker) {
                    const bar = document.getElementById('sw-update');
                    bar.style.display = 'block';
                    document.getElementById('sw-reload').onclick = () => {
                        worker.postMessage({ type: 'SKIP_WAITING' });
                    };
                }

                function listen(registration) {
                    if (!registration) return;
                    if (registration.waiting) {
                        showUpdate(registration.waiting);
                    }
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && registration.waiting) {
                                showUpdate(registration.waiting);
                            }
                        });
                    });
                }

                listen(reg);
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    window.location.reload();
                });
            }).catch(console.error);
        }
    </script>

</body>

</html>
