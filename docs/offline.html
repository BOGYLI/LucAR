<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <title>Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, sans-serif;
            background: #0e0e0e;
            color: #f2f2f2;
            text-align: center;
            padding: 1.5rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 5vw, 3rem);
        }

        p {
            margin: 0.25rem 0;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <main>
        <h1>Offline</h1>
        <p>Keine Verbindung. Die AR-Inhalte sind im Cache verfügbar.</p>
        <p>Bitte Online-Verbindung herstellen und erneut versuchen.</p>
    </main>
</body>

</html>
